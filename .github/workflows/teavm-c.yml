name: TeaVM C (experimental)

# Java -> C with TeaVM, then a native executable: MSVC on Windows, the C compiler
# of the runner on Linux and macOS. See src/teavm-c/README.md.
#
# The generated C is platform independent: it is produced once on Linux, then
# compiled and smoke-tested on one runner per system and architecture
# (Windows, Linux and macOS, x64 and arm64).
#
# Called by ci.yml on every push to master (so it runs once, there is no push
# trigger here). The executables "plantuml-{windows,linux,macos}-{x64,arm64}"
# are then attached to the snapshot release. Can also be started by hand.

on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:

  generate_c:
    name: Generate C sources (TeaVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      # Version, git commit and timestamp reported by the executable (-version)
      - name: Patch build metadata (version / git commit / timestamp)
        run: ./gradlew --no-daemon patchCompilationInfo

      # ":" prefix: only the root project (plantuml-mcp-js also has a TeaVM
      # plugin, and therefore a generateC task, without any C configuration)
      - name: Generate C sources
        run: ./gradlew --no-daemon :generateC

      - name: List generated files
        run: |
          echo "::group::[build/generated/teavm/c]"
          ls -la build/generated/teavm/c
          echo "::endgroup::"
          echo "$(wc -l < build/generated/teavm/c/all.txt) C files"
          test -f build/generated/teavm/c/CMakeLists.txt

      # TeaVM turns into coroutines (fibers) every method that can reach a suspension
      # (Thread.sleep, Object.wait, @Async, java.net.URL...), and its transformation
      # fails on some of them: see tools/teavm-coroutines/README.md.
      - name: Check that the C sources contain no coroutine
        run: python3 tools/teavm-coroutines/check_no_coroutines.py build/generated/teavm/c

      # Same check for the JavaScript engines (browser and headless), built from the
      # same code: browser-test.yml does it too, but does not run on this branch.
      - name: Check that the JavaScript engines contain no coroutine
        run: |
          ./gradlew --no-daemon :generateJavaScript :plantuml-mcp-js:generateJavaScript
          python3 tools/teavm-coroutines/check_no_coroutines.py \
            build/generated/teavm/js/plantuml.js \
            plantuml-mcp-js/build/generated/teavm/js/plantuml-mcp-js.js

      - name: Upload C sources
        uses: actions/upload-artifact@v7
        with:
          name: teavm-c-sources
          path: build/generated/teavm/c
          retention-days: 7

  build_unix:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: generate_c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Download C sources
        uses: actions/download-artifact@v8
        with:
          name: teavm-c-sources
          path: c-sources

      # libcurl reads the URL of !include (macOS has it; the Linux runners may lack the
      # development files)
      - name: Install libcurl (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get install -y libcurl4-openssl-dev

      # Single-configuration generator (Unix Makefiles): the executable is
      # c-sources/bin/plantuml (CMakeLists.txt builds in Release by default)
      # TEMPORARY: -g on Linux, for the backtraces of the diagnostics below (no effect on the code)
      - name: Configure
        run: cmake -S c-sources -B c-build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os == 'linux' && '-DCMAKE_C_FLAGS=-g' || '' }}

      # An explicit number of jobs: a bare --parallel gives make an unlimited -j, which
      # spawns one cc process per generated file at once and exhausts the process
      # limit of the macOS runner ("posix_spawn failed: Resource
      # temporarily unavailable", "make: wait: No child processes")
      - name: Build
        run: cmake --build c-build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Smoke test (mindmap to SVG)
        run: |
          exe="c-sources/bin/plantuml"
          echo "Size: $(wc -c < "$exe") bytes"
          printf '@startmindmap\n* Root\n** Alpha\n** Beta\n@endmindmap\n' > mindmap.puml
          "$exe" -tsvg mindmap.puml
          test -f mindmap.svg || { echo "::error::No SVG was written"; exit 1; }
          cat mindmap.svg
          if ! grep -q "<svg" mindmap.svg || ! grep -q "Alpha" mindmap.svg; then
            echo "::error::The output is not the expected SVG"
            exit 1
          fi

      - name: Smoke test (mindmap to PNG)
        run: |
          exe="c-sources/bin/plantuml"
          "$exe" -tpng mindmap.puml
          test -f mindmap.png || { echo "::error::No PNG was written"; exit 1; }
          echo "PNG: $(wc -c < mindmap.png) bytes"
          signature="$(head -c 4 mindmap.png | tail -c 3)"
          if [ "$signature" != "PNG" ] || ! grep -aq "iTXtplantuml" mindmap.png; then
            echo "::error::The output is not the expected PNG"
            exit 1
          fi

      # ===================================================================================
      # TEMPORARY, to be removed: diagnostics of the failure of the PNG smoke test on
      # linux-x64 (NullPointerException in CRC32 with a heap of 64 MB, segmentation fault
      # with 128 MB). They only run when a step failed, and none of them fails the job.
      # The traces of the program itself ([trace n] from Java, [native] from C) are in the
      # log of the step above, see net.sourceforge.plantuml.teavm.Trace.
      # ===================================================================================
      - name: "Diagnose 1: machine, and is the failure stable?"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          exe="c-sources/bin/plantuml"
          uname -a; cat /etc/os-release | head -2; gcc --version | head -1; ldd "$exe"
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-200; free -m; ulimit -a
          for i in 1 2 3; do
            rm -f mindmap.png
            "$exe" -tpng mindmap.puml > /dev/null 2> run-$i.txt
            echo "run $i: exit code $?, $(wc -l < run-$i.txt) lines of trace, last: $(tail -1 run-$i.txt)"
          done
          echo "::group::[trace] of the last run"
          cat run-3.txt
          echo "::endgroup::"
          echo "-- without address randomization"
          setarch "$(uname -m)" -R "$exe" -tpng mindmap.puml > /dev/null 2> aslr.txt; echo "exit code $?, last: $(tail -1 aslr.txt)"
          echo "-- glibc heap checks"
          MALLOC_CHECK_=3 MALLOC_PERTURB_=165 "$exe" -tpng mindmap.puml > /dev/null 2> malloc.txt; echo "exit code $?, last: $(tail -3 malloc.txt)"
          echo "-- empty environment"
          env -i "$PWD/$exe" -tpng mindmap.puml > /dev/null 2> envi.txt; echo "exit code $?, last: $(tail -1 envi.txt)"
          echo "-- other outputs"
          for t in svg txt utxt; do "$exe" -t$t mindmap.puml > /dev/null 2>&1; echo "-t$t: exit code $?"; done
          printf '@startuml\nclass A\nclass B\nA --> B\n@enduml\n' > class.puml
          "$exe" -tpng class.puml > /dev/null 2>&1; echo "class diagram -tpng: exit code $?"

      # Is the generated C the same as the one of the local generation? Digests to compare
      # with the ones of the person who investigates, and the exact command of the compiler.
      - name: "Diagnose 1b: the generated C and the compiler command"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          for f in classes/com/jcraft/jzlib/CRC32.c classes/java/util/zip/CRC32.c core.h memory.c definitions.h CMakeLists.txt; do
            echo "$(sha1sum c-sources/$f | cut -c1-12) $f"
          done
          echo "files: $(wc -l < c-sources/all.txt)"
          grep -n "teavm_initHeap" c-sources/main.c
          touch c-sources/classes/com/jcraft/jzlib/CRC32.c
          cmake --build c-build -- VERBOSE=1 2>&1 | grep -m2 "CRC32.c" | cut -c1-700
          readelf -p .comment c-sources/bin/plantuml | head -5

      # Where does the table of CRC32 (or the flag "initialized" of the class) change? The
      # watchpoints stop the program at each change and print where it comes from.
      - name: "Diagnose 1c: gdb watchpoints on the table and on the flags of CRC32"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y gdb > /dev/null
          cat > watch.gdb <<'EOF'
          set pagination off
          set breakpoint pending on
          tbreak main
          run
          info variables CRC32
          watch -l sfld_cjj_CRC32_crc_table
          watch -l cjj_CRC32_Cls.parent.flags
          commands 2
          bt 12
          continue
          end
          commands 3
          bt 12
          continue
          end
          continue
          EOF
          gdb -batch -x watch.gdb --args c-sources/bin/plantuml -tpng mindmap.puml 2>&1 | head -200

      - name: "Diagnose 2: gdb backtrace of the segmentation fault"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y gdb > /dev/null
          gdb -batch -ex "set pagination off" -ex run -ex "bt 40" -ex "p \$_siginfo._sifields._sigfault.si_addr" \
              -ex "info registers" -ex "x/12i \$pc" -ex "info proc mappings" \
              --args c-sources/bin/plantuml -tpng mindmap.puml 2>&1 | tail -200

      - name: "Diagnose 3: valgrind"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          sudo apt-get install -y valgrind > /dev/null
          valgrind --error-limit=no --track-origins=yes --num-callers=30 \
              c-sources/bin/plantuml -tpng mindmap.puml 2>&1 | tail -250

      # The heap is a constant of main.c: only this file is compiled again for each size
      - name: "Diagnose 4: heap size sweep"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          exe="c-sources/bin/plantuml"
          grep -n "teavm_initHeap" c-sources/main.c
          cp c-sources/main.c main.c.orig
          for mb in 16 32 48 64 96 128 192 256 512 1024; do
            bytes=$((mb * 1024 * 1024))
            sed -E "s/teavm_initHeap\([0-9]+, [0-9]+\)/teavm_initHeap($bytes, $bytes)/" main.c.orig > c-sources/main.c
            if ! cmake --build c-build --parallel "$(getconf _NPROCESSORS_ONLN)" > build-$mb.log 2>&1; then
              echo "heap $mb MB: the build failed"; tail -3 build-$mb.log; continue
            fi
            "$exe" -tpng mindmap.puml > /dev/null 2> sweep-$mb.txt; png=$?
            "$exe" -tsvg mindmap.puml > /dev/null 2>&1; svg=$?
            echo "heap $mb MB: -tpng exit code $png, -tsvg exit code $svg, last line: $(tail -1 sweep-$mb.txt)"
          done
          cp main.c.orig c-sources/main.c

      # The checks of the runtime of TeaVM itself: the consistency of the heap is verified at
      # each garbage collection (abort on the first problem), and each collection is printed
      - name: "Diagnose 5: runtime of TeaVM with the memory trace and the GC statistics"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          rm -rf c-trace c-trace-build
          cp -r c-sources c-trace
          cmake -S c-trace -B c-trace-build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-g -DTEAVM_MEMORY_TRACE=1 -DTEAVM_GC_STATS=1"
          cmake --build c-trace-build --parallel "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tail -5
          c-trace/bin/plantuml -tpng mindmap.puml 2>&1 | tail -150
          echo "exit code: ${PIPESTATUS[0]}"

      # The same code without optimization: if it works, the failure comes from an optimization
      - name: "Diagnose 5b: no optimization (-O0)"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          rm -rf c-o0 c-o0-build
          cp -r c-sources c-o0
          cmake -S c-o0 -B c-o0-build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-g -O0"
          cmake --build c-o0-build --parallel "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tail -3
          c-o0/bin/plantuml -tpng mindmap.puml 2>&1 | grep -E "CRC32|zlib|exit|Exception" | head -8
          echo "exit code: ${PIPESTATUS[0]}"

      # Hypothesis: the write barrier of the core.h generated by TeaVM 0.16.0 writes a byte of
      # the card table for ANY object, also one outside of the heap (a string literal, a class:
      # the store of a monitor, see https://github.com/konsoletyper/teavm/issues/1330 and its
      # fix f30b56f), which corrupts the memory at a place that depends on the addresses. Not seen
      # in the local runs. Here each call outside of the heap is reported with the C function
      # that makes it ("[barrier] OUTSIDE OF THE HEAP"), and its barrier is skipped.
      - name: "Diagnose 5c: bounds check in the write barrier"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          cat > patch_barrier.py <<'PY'
          #!/usr/bin/env python3
          """TEMPORARY: bounds check in the write barrier of the generated core.h (the barrier of
          TeaVM 0.16.0 writes a byte of the card table at (object - heap) / region size, for any
          object: an object outside of the heap, such as a string literal, corrupts the memory).
          Every call with an object outside of the heap is reported, with the C function that
          makes it, and its barrier is skipped (the GC traverses these objects explicitly)."""
          import sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          old = '''inline static void teavm_gc_writeBarrier(void* object) {
              intptr_t offset = (intptr_t) ((char*) object - (char*) teavm_gc_heapAddress) / teavm_gc_regionSize;
              ((char*) teavm_gc_cardTable)[offset] = 0;
          }'''
          new = '''#include <stdio.h>
          inline static void teavm_gc_writeBarrierDbg(void* object, const char* where) {
              if ((char*) object < (char*) teavm_gc_heapAddress
                      || (char*) object >= (char*) teavm_gc_heapAddress + teavm_gc_availableBytes) {
                  fprintf(stderr, "[barrier] OUTSIDE OF THE HEAP: %s: object %p, heap %p + %lld, offset would be %lld\\n", where,
                          object, teavm_gc_heapAddress, (long long) teavm_gc_availableBytes,
                          (long long) ((intptr_t) ((char*) object - (char*) teavm_gc_heapAddress) / teavm_gc_regionSize));
                  fflush(stderr);
                  return;
              }
              intptr_t offset = (intptr_t) ((char*) object - (char*) teavm_gc_heapAddress) / teavm_gc_regionSize;
              ((char*) teavm_gc_cardTable)[offset] = 0;
          }
          #define teavm_gc_writeBarrier(object) teavm_gc_writeBarrierDbg((void*) (object), __func__)'''
          if old not in text:
              sys.exit("core.h: the write barrier was not found, nothing patched")
          open(path, 'w', encoding='utf-8').write(text.replace(old, new, 1))
          print("core.h patched:", path)
          PY
          rm -rf c-barrier c-barrier-build
          cp -r c-sources c-barrier
          python3 patch_barrier.py c-barrier/core.h
          cmake -S c-barrier -B c-barrier-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-g
          cmake --build c-barrier-build --parallel "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tail -3
          for t in svg png; do
            c-barrier/bin/plantuml -t$t mindmap.puml > /dev/null 2> barrier-$t.txt
            echo "-t$t: exit code $?, $(grep -c 'OUTSIDE OF THE HEAP' barrier-$t.txt) calls outside of the heap"
            grep -E "OUTSIDE OF THE HEAP" barrier-$t.txt | sed -E 's/object 0x[0-9a-f]+/object ADDRESS/' | sort | uniq -c | sort -rn | head -15
            grep -E "CRC32|zlib" barrier-$t.txt | head -4
          done

      - name: "Diagnose 6: AddressSanitizer"
        if: failure() && matrix.os == 'linux' && matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set +e
          rm -rf c-asan c-asan-build
          cp -r c-sources c-asan
          cmake -S c-asan -B c-asan-build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS="-g -fsanitize=address -fno-omit-frame-pointer"
          cmake --build c-asan-build --parallel "$(getconf _NPROCESSORS_ONLN)" 2>&1 | tail -5
          ASAN_OPTIONS=detect_leaks=0 c-asan/bin/plantuml -tpng mindmap.puml 2>&1 | head -200
          echo "exit code: ${PIPESTATUS[0]}"

      # -pipe: the source on the standard input, the image on the standard output (what
      # Kroki does). TeaVM's System.in cannot read in the C build (StdinStream replaces it).
      - name: Smoke test (pipe)
        run: |
          exe="c-sources/bin/plantuml"
          cat mindmap.puml | "$exe" -pipe -tsvg > pipe.svg
          if ! grep -q "<svg" pipe.svg || ! grep -q "Alpha" pipe.svg; then
            echo "::error::The SVG of -pipe is not the expected one"
            exit 1
          fi
          # Standard input redirected from a file, not from a pipe
          "$exe" -pipe -tsvg < mindmap.puml > pipe-redirect.svg
          cmp pipe.svg pipe-redirect.svg \
            || { echo "::error::-pipe gives another SVG when the input is a file"; exit 1; }
          cat mindmap.puml | "$exe" -pipe -tpng > pipe.png
          signature="$(head -c 4 pipe.png | tail -c 3)"
          if [ "$signature" != "PNG" ]; then
            echo "::error::The PNG of -pipe is not the expected one"
            exit 1
          fi

      # Text output (no AWT, no native code): the sequence diagrams have their own text
      # renderer, the other diagrams are drawn by UGraphicTxt
      - name: Smoke test (text)
        run: |
          exe="c-sources/bin/plantuml"
          printf '@startuml\nAlice -> Bob: Hello\n@enduml\n' > seq.puml
          for format in txt utxt; do
            "$exe" -pipe -t$format < seq.puml > seq.$format
            if ! grep -q "Alice" seq.$format || ! grep -q "Hello" seq.$format; then
              echo "::error::The output of -t$format is not the expected text"
              cat seq.$format
              exit 1
            fi
            cat seq.$format
          done

      # The executable has the entry point of the JVM (Run): same help, same flags
      - name: Smoke test (help)
        run: |
          exe="c-sources/bin/plantuml"
          help="$("$exe" --help)"
          echo "$help"
          if ! grep -q "Show help and usage information" <<< "$help" \
            || ! grep -q "Generate SVG images" <<< "$help"; then
            echo "::error::The help is not the expected one"
            exit 1
          fi

      - name: Smoke test (exit code)
        run: |
          exe="c-sources/bin/plantuml"
          code=0
          "$exe" no-such-file.puml || code=$?
          # 50: no file found, as on the JVM
          if [ "$code" -ne 50 ]; then
            echo "::error::Expected the exit code 50, got $code"
            exit 1
          fi

      - name: Upload the SVG and the PNG
        uses: actions/upload-artifact@v7
        with:
          name: mindmap-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            mindmap.svg
            mindmap.png
          retention-days: 7

      # upload-artifact does not keep the executable bit: release-snapshot.sh sets it again
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: plantuml-${{ matrix.os }}-${{ matrix.arch }}
          path: c-sources/bin/plantuml
          retention-days: 30
