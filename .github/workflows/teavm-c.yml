name: TeaVM C (experimental)

# Java -> C with TeaVM, then a native Windows executable built with MSVC.
# See src/teavm-c/README.md.
#
# The generated C is platform independent: it is produced once on Linux, then
# compiled and smoke-tested on one Windows runner per architecture.

on:
  push:
    branches: [ master-c ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  generate_c:
    name: Generate C sources (TeaVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      # ":" prefix: only the root project (plantuml-mcp-js also has a TeaVM
      # plugin, and therefore a generateC task, without any C configuration)
      - name: Generate C sources
        run: ./gradlew --no-daemon :generateC

      - name: List generated files
        run: |
          echo "::group::[build/generated/teavm/c]"
          ls -la build/generated/teavm/c
          echo "::endgroup::"
          echo "$(wc -l < build/generated/teavm/c/all.txt) C files"
          test -f build/generated/teavm/c/CMakeLists.txt

      # TeaVM turns into coroutines (fibers) every method that can reach a suspension
      # (Thread.sleep, Object.wait, @Async, java.net.URL...), and its transformation
      # fails on some of them: see tools/teavm-coroutines/README.md.
      - name: Check that the C sources contain no coroutine
        run: python3 tools/teavm-coroutines/check_no_coroutines.py build/generated/teavm/c

      # Same check for the JavaScript engines (browser and headless), built from the
      # same code: browser-test.yml does it too, but does not run on this branch.
      - name: Check that the JavaScript engines contain no coroutine
        run: |
          ./gradlew --no-daemon :generateJavaScript :plantuml-mcp-js:generateJavaScript
          python3 tools/teavm-coroutines/check_no_coroutines.py \
            build/generated/teavm/js/plantuml.js \
            plantuml-mcp-js/build/generated/teavm/js/plantuml-mcp-js.js

      - name: Upload C sources
        uses: actions/upload-artifact@v7
        with:
          name: teavm-c-sources
          path: build/generated/teavm/c
          retention-days: 7

  build_windows:
    name: Build windows-${{ matrix.arch }}
    needs: generate_c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            cmake_platform: x64
          - arch: arm64
            runner: windows-11-arm
            cmake_platform: ARM64

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Download C sources
        uses: actions/download-artifact@v8
        with:
          name: teavm-c-sources
          path: c-sources

      # No -G: CMake picks the newest Visual Studio generator installed on the
      # runner (2022 or 2026), which finds MSVC by itself (no developer prompt).
      # TeaVM's runtime requires MSVC: it detects Windows via _MSC_VER.
      - name: Configure (MSVC, ${{ matrix.cmake_platform }})
        shell: pwsh
        run: cmake -S c-sources -B c-build -A ${{ matrix.cmake_platform }}

      - name: Build
        shell: pwsh
        run: cmake --build c-build --config Release

      - name: Smoke test (mindmap to SVG)
        shell: pwsh
        run: |
          $exe = "c-sources/bin/Release/plantuml-c.exe"
          Write-Host "Size: $((Get-Item $exe).Length) bytes"
          $src = "@startmindmap`n* Root`n** Alpha`n** Beta`n@endmindmap`n"
          [System.IO.File]::WriteAllText("mindmap.puml", $src)
          & $exe mindmap.puml mindmap.svg
          if ($LASTEXITCODE -ne 0) { throw "plantuml-c.exe exited with code $LASTEXITCODE" }
          if ((Test-Path mindmap.svg) -eq $false) { throw "No SVG was written" }
          $svg = Get-Content -Raw mindmap.svg
          Write-Host $svg
          if ($svg -notmatch "<svg" -or $svg -notmatch "Alpha") {
            Write-Host "::error::The output is not the expected SVG"
            exit 1
          }

      - name: Smoke test (mindmap to PNG)
        shell: pwsh
        run: |
          $exe = "c-sources/bin/Release/plantuml-c.exe"
          & $exe mindmap.puml mindmap.png
          if ($LASTEXITCODE -ne 0) { throw "plantuml-c.exe exited with code $LASTEXITCODE" }
          if ((Test-Path mindmap.png) -eq $false) { throw "No PNG was written" }
          $bytes = [System.IO.File]::ReadAllBytes("mindmap.png")
          Write-Host "PNG: $($bytes.Length) bytes"
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, 1, 3)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($signature -ne "PNG" -or $text.Contains("iTXtplantuml") -eq $false) {
            Write-Host "::error::The output is not the expected PNG"
            exit 1
          }

      - name: Upload the SVG and the PNG
        uses: actions/upload-artifact@v7
        with:
          name: mindmap-windows-${{ matrix.arch }}
          path: |
            mindmap.svg
            mindmap.png
          retention-days: 7

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: plantuml-c-windows-${{ matrix.arch }}
          path: c-sources/bin/Release/plantuml-c.exe
          retention-days: 30
