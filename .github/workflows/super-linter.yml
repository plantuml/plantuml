# Runs Super-Linter on the files changed by each push / pull request.
#
# Only the linters listed below (VALIDATE_xxx: true) are run.
# Their configuration files live in tools/linters/ (see tools/linters/README.md).
#
# https://github.com/super-linter/super-linter
name: Lint Code Base

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Reused by "CI (other branch)" (ci-other.yml)
  workflow_call:

permissions: {}

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        # Super-Linter slim v9.0.0, run by image digest: an image tag can be pushed again.
        # Dependabot does not follow docker:// references, so an upgrade is a manual edit
        # of the tag and of the digest that tag has on ghcr.io.
        uses: docker://ghcr.io/super-linter/super-linter:slim-v9.0.0@sha256:7d0b4d3387deaac975e86e0787c7a05a25d530469b27d74c2b4599ab5800d9e4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only lint the files changed by the push / pull request
          VALIDATE_ALL_CODEBASE: false
          LINTER_RULES_PATH: tools/linters
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # Linters to run (all others are disabled)
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_JAVA: true
          JAVA_FILE_NAME: checkstyle.xml
          VALIDATE_YAML: true
