name: CI

on:
  # Note: the `create` event does not support filters (it fires for every
  # branch or tag creation); .github/scripts/workflow-config.sh checks ref_type.
  create:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  jdk8:
    name: Build & Run with Ant (Java 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Ensure Ant present
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ant
          fi
          ant -version

      - name: Build with Ant
        run: ant -noinput

      - name: Check PlantUML version (expect exit code 16)
        run: |
          set +e
          java -jar plantuml.jar -version
          CODE=$?
          echo "Exit code: $CODE"
          if [ $CODE -ne 16 ]; then
            echo "::error::Unexpected exit code (expected 16, got $CODE)"
            exit 1
          fi

      - name: Upload plantuml.jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plantuml-jdk8-jar
          path: plantuml.jar
          if-no-files-found: error
          retention-days: 30

      - name: Run sample diagram test (ASCII)
        run: |
          echo "Alice -> Bob : it works!" | java -jar plantuml.jar -pipe -ttxt


  workflow_config:
    runs-on: ubuntu-latest
    outputs:
      do_release: ${{ steps.config.outputs.do_release }}
      do_snapshot_release: ${{ steps.config.outputs.do_snapshot_release }}
      do_javadoc: ${{ steps.config.outputs.do_javadoc }}
      do_test_linux: ${{ steps.config.outputs.do_test_linux }}
      do_test_windows: ${{ steps.config.outputs.do_test_windows }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Configure workflow
        id: config
        env:
          ACTOR: ${{ github.actor }}
          EVENT_ACTION: ${{ github.event.action }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref }}
        run: .github/scripts/workflow-config.sh

  # We run the tests on many OS / Java combinations but also the Compile step because some users build
  # their own jars from source, so it is good for CI to check that is working on all combinations.
  # We split windows and ubuntu because windows is so slow...
  test_linux:
    needs: workflow_config
    strategy:
      fail-fast: false
      matrix:
        java_version: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repository
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        uses: actions/checkout@v7

      - name: Set up java
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java_version }}
          distribution: temurin
          cache: gradle

      # Use of `setup-gradle`, see https://github.com/gradle/actions/
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Diagnostic
        run: .github/scripts/diagnostic.sh

      - name: Compile
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        run: gradle -q compileJava --no-daemon

      - name: Test
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        run: gradle test --no-daemon -i

      - name: Check Javadoc (fails on warnings)
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        run: gradle javadoc --no-daemon

      - name: Test Summary
        if: needs.workflow_config.outputs.do_test_linux == 'true' && always()
        run: .github/scripts/test-summary.sh

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: needs.workflow_config.outputs.do_test_linux == 'true'
        with:
          # Using github.run_number here to reduce confusion when downloading & comparing from several builds
          name: ${{ github.run_number }}-${{ matrix.os }}-java-${{ matrix.java_version }}-test-reports
          path: build/reports/tests/

      - name: Upload Vega test results
        uses: actions/upload-artifact@v7
        if: needs.workflow_config.outputs.do_test_linux == 'true' && always()
        with:
          name: vega-results
          path: src/test/resources/vega/vega.json
          if-no-files-found: warn
          retention-days: 30

      - name: Add Gradle title to Summary
        run: echo "## Gradle" >> "$GITHUB_STEP_SUMMARY"

  build_artifacts:
    needs: [ workflow_config ]
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set up java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Generate artifacts
        run: |
          chmod +x .github/scripts/print-gradle-properties-and-release-version.sh
          .github/scripts/print-gradle-properties-and-release-version.sh
          gradle patchCompilationInfo
          gradle clean build \
            teavmZip \
            generateMetadataFileForMavenPublication generatePomFileForMavenPublication \
            -x test
          echo "::group::[List JAR]"
          find . -name "*.jar"
          echo "::endgroup::"
      - name: Sign artifacts
        if: env.ORG_GRADLE_PROJECT_signingKey
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ARTIFACT_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ARTIFACT_SIGNING_PASSPHRASE }}
        run: |
          gradle -i signMavenPublication
          echo "::group::[List LIBS]"
          ls -l build/libs
          ls -l license-variants/plantuml-asl/build/libs
          ls -l license-variants/plantuml-bsd/build/libs
          ls -l license-variants/plantuml-epl/build/libs
          ls -l license-variants/plantuml-lgpl/build/libs
          ls -l license-variants/plantuml-mit/build/libs
          ls -l license-variants/plantuml-mit-light/build/libs
          ls -l license-variants/plantuml-gplv2/build/libs
          echo "::endgroup::"
      - name: Get release version
        id: version
        run: |
          echo "release_version=$(gradle properties -q | grep "version:" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache libs
        uses: actions/cache/save@v6
        with:
          path: |
            build/libs
            build/publications
            license-variants/plantuml-asl/build/libs
            license-variants/plantuml-bsd/build/libs
            license-variants/plantuml-epl/build/libs
            license-variants/plantuml-lgpl/build/libs
            license-variants/plantuml-mit/build/libs
            license-variants/plantuml-mit-light/build/libs
            license-variants/plantuml-gplv2/build/libs
          key: "libs-${{ github.run_id }}"
          enableCrossOsArchive: true

      - name: Upload plantuml JAR
        uses: actions/upload-artifact@v7
        with:
          name: plantuml-jar
          path: |
            build/libs/plantuml-*.jar
            !build/libs/plantuml-*-javadoc.jar
            !build/libs/plantuml-*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload js-plantuml ZIP
        uses: actions/upload-artifact@v7
        with:
          name: js-plantuml-zip
          path: build/libs/js-plantuml-*.zip
          if-no-files-found: error
          retention-days: 30

  # TEMPORARY: the jobs after build_artifacts were removed (site, upload, Docker, Sonar,
  # Eclipse release) and teavm-c.yml only builds linux-x64, to investigate the C build
  create_c_executable:
    needs: [ workflow_config, jdk8 ]
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/teavm-c.yml
