name: Browser (browser-test)

# Functional checks for the browser (TeaVM) engine: builds the MIT npm package and asserts
# behaviour in headless Chromium. Unlike perf-bench this one fails the build when a check fails.
# To stop spending CI minutes on it, delete this file; tools/browser-test/README.md documents how to
# run the same checks locally in one command.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: browser-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build engine
        run: |
          ./gradlew :plantuml-mit:npmPackage -Pci --no-daemon
          test -f license-variants/plantuml-mit/build/npm-plantuml/plantuml.js
          test -f license-variants/plantuml-mit/build/npm-plantuml/themes.js

      # The engine must not rely on TeaVM coroutines (threads, Object.wait(), @Async...):
      # see tools/teavm-coroutines/README.md. The headless engine (MCP server) is built
      # from the same code, through another entry point, so it is checked as well.
      - name: Check that the engines contain no coroutine
        run: |
          ./gradlew :plantuml-mcp-js:generateJavaScript --no-daemon
          python3 tools/teavm-coroutines/check_no_coroutines.py \
            license-variants/plantuml-mit/build/npm-plantuml/plantuml.js \
            plantuml-mcp-js/build/generated/teavm/js/plantuml-mcp-js.js

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/browser-test/package-lock.json

      - name: Install Playwright
        run: |
          cd tools/browser-test
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Add Checks title to Summary
        run: |
          echo "## Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: ▶️ Check all (run all checks)
        run: node tools/browser-test/run-all-checks.js target=license-variants/plantuml-mit/build/npm-plantuml

      - name: Add Gradle title to Summary
        run: echo "## Gradle" >> "$GITHUB_STEP_SUMMARY"
