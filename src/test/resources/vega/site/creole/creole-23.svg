    <line style="stroke:#181818;stroke-width:1;" x1="16" x2="535.575" y1="58" y2="58"/>
    <text fill="#000" font-family="monospace" font-size="12" textLength="427.425" x="26" y="72.333">This is the Pythagorean theorem: a&lt;sup&gt;2&lt;/sup&gt; + b&lt;sup&gt;2&lt;/sup&gt; = c&lt;sup&gt;2&lt;/sup&gt;</text>
    <text fill="#000" font-size="12" textLength="170.025" x="26" y="88.333">This is the Pythagorean theorem: a</text>
    <text fill="#000" font-size="9" x="196.025" y="82">2</text>
    <text fill="#000" font-size="12" textLength="13.725" x="201.031" y="88.333">+ b</text>
    <text fill="#000" font-size="9" x="214.756" y="82">2</text>
    <text fill="#000" font-size="12" textLength="13.05" x="219.763" y="88.333">= c</text>
    <text fill="#000" font-size="9" x="232.813" y="82">2</text>
