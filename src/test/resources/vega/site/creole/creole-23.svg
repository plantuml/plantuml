    <text fill="#000" font-family="monospace" font-size="12" textLength="499.575" x="26" y="35.333">This is the "caffeine" molecule: C&lt;sub&gt;8&lt;/sub&gt;H&lt;sub&gt;10&lt;/sub&gt;N&lt;sub&gt;4&lt;/sub&gt;O&lt;sub&gt;2&lt;/sub&gt;</text>
    <text fill="#000" font-size="12" textLength="158.7" x="26" y="47.333">This is the "caffeine" molecule: C</text>
    <text fill="#000" font-size="9" x="184.7" y="50">8</text>
    <text fill="#000" font-size="12" x="189.706" y="47.333">H</text>
    <text fill="#000" font-size="9" textLength="10.013" x="198.406" y="50">10</text>
    <text fill="#000" font-size="12" x="208.419" y="47.333">N</text>
    <text fill="#000" font-size="9" x="217.119" y="50">4</text>
