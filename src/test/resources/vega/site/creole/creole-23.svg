<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="121px" preserveAspectRatio="none" style="width:556px;height:121px;background:#FFFFFF;" version="1.1" viewBox="0 0 556 121" width="556px" zoomAndPan="magnify">
  <defs/>
