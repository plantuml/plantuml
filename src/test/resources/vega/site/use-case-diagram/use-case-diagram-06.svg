  <g font-family="sans-serif" lengthAdjust="spacing">
    <!--entity UC1-->
    <g class="entity" data-qualified-name="UC1" data-source-line="2" id="ent0001">
      <ellipse cx="142.444" cy="91.061" fill="#F1F1F1" rx="136.444" ry="79.061" style="stroke:#181818;stroke-width:0.5;"/>
      <text fill="#000" font-size="14" textLength="70.087" x="107.401" y="39.558">You can use</text>
      <text fill="#000" font-size="14" textLength="207.025" x="38.932" y="53.558">several lines to define your usecase.</text>
      <text fill="#000" font-size="14" textLength="165.725" x="59.582" y="67.558">You can also use separators.</text>
      <line style="stroke:#181818;stroke-width:1;" x1="11.616" x2="273.272" y1="70.67" y2="70.67"/>
      <text fill="#000" font-size="14" textLength="189.088" x="47.901" y="85.558">Several separators are possible.</text>
      <line style="stroke:#181818;stroke-width:1;" x1="7.028" x2="277.86" y1="92.67" y2="92.67"/>
      <line style="stroke:#181818;stroke-width:1;" x1="7.142" x2="277.747" y1="94.67" y2="94.67"/>
      <text fill="#000" font-size="14" textLength="126.088" x="79.401" y="107.558">And you can add titles:</text>
      <text fill="#000" font-size="14" textLength="168.263" x="55.313" y="139.558">This allows large description.</text>
      <line style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;" x1="17.641" x2="107.751" y1="121.67" y2="121.67"/>
      <text fill="#000" font-size="14" textLength="69.388" x="107.751" y="125.058">Conclusion</text>
      <line style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;" x1="177.138" x2="267.248" y1="121.67" y2="121.67"/>
    </g>
