<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="186px" preserveAspectRatio="none" style="width:295px;height:186px;background:#FFFFFF;" version="1.1" viewBox="0 0 295 186" width="295px" zoomAndPan="magnify">
