<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wasm-PlantUML</title>
<style>
textarea {
	width: 100%;
	box-sizing: border-box;
}
</style>
</head>
<body>
	<p>
		<strong>Experimental Wasm GC build</strong> – Powered by <a
			href="https://github.com/plantuml/plantuml">PlantUML</a>, <a
			href="https://github.com/konsoletyper/teavm">TeaVM</a> &amp; <a
			href="https://github.com/mdaines/viz-js">Viz.js</a>
	</p>
	<div id="status"
		style="margin-bottom: 6px; font-family: monospace; color: #555;">
		Loading in progress...
	</div>
	<textarea id="src" rows="10">@startuml
Alice->Bob : Hello
return ok
@enduml</textarea>
	<div id="out"></div>

	<script src="viz-global.js"></script>
	<script type="module">
		import { render, isWasmGCSupported } from "./plantuml-wasm.js";
		if (!isWasmGCSupported()) {
			document.getElementById("status").textContent = "This browser does not support Wasm GC: use index-basic.html (JS engine) instead.";
		}
		const textarea = document.getElementById("src");
		function renderNow() {
			render(textarea.value.split(/\r\n|\r|\n/), "out");
		}
		textarea.addEventListener("input", renderNow);
		renderNow();
	</script>
</body>
</html>
